name: Test Gateway Lakehouse Quickstart (E2E)

on:
  push:
    branches:
      - test/quickstart
  workflow_dispatch:

env:
  # The 1.0 development Flink quickstart image is built locally because the
  # unreleased image is not expected to be available on Docker Hub.
  # Update this when the Flink base version changes.
  FLINK_QUICKSTART_DOCKER_VERSION: "1.20-1.0-SNAPSHOT"
  COMPOSE_FILE: /tmp/gateway-lakehouse-compose.yaml
  LIB_DIR: /tmp/lib
  GATEWAY_URL: http://localhost:8080

jobs:
  gateway-lakehouse-e2e:
    runs-on: ubuntu-latest
    # Increased from 60 min: Maven build + 3 Docker image builds need headroom.
    timeout-minutes: 120

    steps:
      # ----------------------------------------------------------
      # Basic setup
      # ----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: "11"
          distribution: temurin

      # Cache the local Maven repository to speed up repeated CI runs.
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Show tool versions
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version
          java -version
          python3 --version

      # ----------------------------------------------------------
      # Lint the quickstart doc before doing any heavy work.
      # Catches broken Markdown links (space before '(') and any
      # $PLACEHOLDER$ tokens that appear outside fenced code blocks.
      # ----------------------------------------------------------
      - name: Lint quickstart documentation
        shell: bash
        run: |
          set -euo pipefail

          DOC="website/docs/quickstart/gateway-lakehouse.md"
          test -f "$DOC" || { echo "ERROR: $DOC not found"; exit 1; }

          python3 - "$DOC" <<'PY'
          import re
          import sys

          path = sys.argv[1]
          text = open(path).read()
          errors = []

          # Check for broken Markdown links: "] (" with a space before the paren.
          broken = re.findall(r'\]\s+\(https?://', text)
          if broken:
              errors.append(f"Broken Markdown link(s) — space before '(': {broken}")

          # Strip fenced code blocks, then check for unresolved $PLACEHOLDER$ tokens.
          stripped = re.sub(r'```.*?```', '', text, flags=re.S)
          unresolved = re.findall(r'\$[A-Z][A-Z0-9_]*\$', stripped)
          # $GATEWAY_URL$ and $CLUSTER$ are intentional shell variables in the doc.
          false_positives = {'$GATEWAY_URL$', '$CLUSTER$', '$DATABASE$'}
          real = [t for t in unresolved if t not in false_positives]
          if real:
              errors.append(f"Unresolved placeholder(s) outside code blocks: {real}")

          if errors:
              for e in errors:
                  print(f"LINT ERROR: {e}", file=sys.stderr)
              sys.exit(1)

          print("Doc lint passed.")
          PY

      # ----------------------------------------------------------
      # Resolve the versions used by the documentation.
      # ----------------------------------------------------------
      - name: Resolve quickstart versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path("website/fluss-versions.json").read_text())
          next_version = next(v for v in data if v["versionName"] == "next")

          fluss_version        = next_version["fullVersion"]
          fluss_docker_version = next_version["dockerVersion"]
          paimon_version       = next_version["paimonVersion"]

          # The 1.0 development Flink quickstart image is built locally.
          # Read from the JSON if a key exists, otherwise fall back to the
          # workflow-level env var set at the top of this file.
          flink_docker_version = next_version.get(
              "flinkQuickstartDockerVersion",
              os.environ["FLINK_QUICKSTART_DOCKER_VERSION"],
          )

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"fluss_version={fluss_version}\n")
              f.write(f"fluss_docker_version={fluss_docker_version}\n")
              f.write(f"paimon_version={paimon_version}\n")
              f.write(f"flink_docker_version={flink_docker_version}\n")

          print(f"FLUSS_VERSION            = {fluss_version}")
          print(f"FLUSS_DOCKER_VERSION     = {fluss_docker_version}")
          print(f"PAIMON_VERSION           = {paimon_version}")
          print(f"FLINK_DOCKER_VERSION     = {flink_docker_version}")
          PY

      # ----------------------------------------------------------
      # Extract the Compose example directly from the quickstart so the
      # test cannot drift from the documented Compose setup.
      # ----------------------------------------------------------
      - name: Prepare Compose file from documentation
        shell: bash
        env:
          FLUSS_VERSION:                       ${{ steps.versions.outputs.fluss_version }}
          FLUSS_DOCKER_VERSION:                ${{ steps.versions.outputs.fluss_docker_version }}
          PAIMON_VERSION:                      ${{ steps.versions.outputs.paimon_version }}
          FLUSS_QUICKSTART_FLINK_DOCKER_VERSION: ${{ steps.versions.outputs.flink_docker_version }}
        run: |
          set -euo pipefail

          DOC="website/docs/quickstart/gateway-lakehouse.md"
          test -f "$DOC" || { echo "ERROR: $DOC not found"; exit 1; }

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          doc_path = "website/docs/quickstart/gateway-lakehouse.md"
          md = Path(doc_path).read_text()

          # Extract the first ```yaml ... ``` fenced block (the docker-compose).
          blocks = re.findall(r"```yaml\s*\n(.*?)```", md, re.S)
          if not blocks:
              raise SystemExit(f"No YAML fenced block found in {doc_path}")

          compose = blocks[0]

          substitutions = {
              "$FLUSS_VERSION$":                         os.environ["FLUSS_VERSION"],
              "$FLUSS_DOCKER_VERSION$":                  os.environ["FLUSS_DOCKER_VERSION"],
              "$PAIMON_VERSION$":                        os.environ["PAIMON_VERSION"],
              "$FLUSS_QUICKSTART_FLINK_DOCKER_VERSION$": os.environ["FLUSS_QUICKSTART_FLINK_DOCKER_VERSION"],
          }
          for old, new in substitutions.items():
              compose = compose.replace(old, new)

          unresolved = re.findall(r"\$[A-Z][A-Z0-9_]*\$", compose)
          if unresolved:
              raise SystemExit(f"Unresolved placeholders in Compose YAML: {unresolved}")

          out = "/tmp/gateway-lakehouse-compose.yaml"
          Path(out).write_text(compose)
          print(f"Compose file written to {out}")
          print(compose)
          PY

          # Validate the generated Compose file is syntactically correct.
          docker compose -f /tmp/gateway-lakehouse-compose.yaml config --quiet
          echo "Compose file validated successfully."

      # ----------------------------------------------------------
      # Download the Paimon S3 plugin jar required by the Fluss servers.
      # Done before the Maven build so a download failure is caught early.
      # ----------------------------------------------------------
      - name: Download Paimon S3 jar
        shell: bash
        run: |
          set -euo pipefail

          PAIMON_VERSION="${{ steps.versions.outputs.paimon_version }}"
          mkdir -p "$LIB_DIR"

          curl -fL --retry 3 --retry-delay 5 \
            "https://repo.maven.apache.org/maven2/org/apache/paimon/paimon-s3/${PAIMON_VERSION}/paimon-s3-${PAIMON_VERSION}.jar" \
            -o "${LIB_DIR}/paimon-s3-${PAIMON_VERSION}.jar"

          test -s "${LIB_DIR}/paimon-s3-${PAIMON_VERSION}.jar"
          echo "Downloaded paimon-s3-${PAIMON_VERSION}.jar ($(du -sh ${LIB_DIR}/paimon-s3-${PAIMON_VERSION}.jar | cut -f1))"

      # ----------------------------------------------------------
      # Build only the Fluss distribution needed by the server image.
      # The distribution tarball contains the same /opt/fluss layout the
      # Dockerfile expects, without depending on the repository-wide
      # build-target symlink.
      # ----------------------------------------------------------
      - name: Build Fluss distribution
        shell: bash
        run: |
          set -euo pipefail

          ./mvnw clean package \
            -pl fluss-dist,fluss-flink \
            -am \
            -DskipTests \
            -DskipITs \
            -Dmaven.test.skip=true \
            -T 1C \
            --no-transfer-progress

          FLUSS_VERSION="${{ steps.versions.outputs.fluss_version }}"

          DIST_TGZ="fluss-dist/target/fluss-${FLUSS_VERSION}-bin.tgz"
          test -f "$DIST_TGZ" || {
            echo "ERROR: expected distribution tarball not found: $DIST_TGZ"
            ls -lh fluss-dist/target/ || true
            exit 1
          }
          TIERING_JAR="fluss-flink/fluss-flink-tiering/target/fluss-flink-tiering-${FLUSS_VERSION}.jar"
          test -f "$TIERING_JAR" || {
          echo "ERROR: tiering jar not found: $TIERING_JAR"
          ls -lh fluss-flink/fluss-flink-tiering/target/ || true
          exit 1
          }
          JAR_SIZE="$(stat -c%s "TIERING_JAR")"
          if [["$JAR_SIZE" -lt 1048576]]; then
            echo: "${JAR_SIZE} bytes , looks like thin jar" >&2
            ls -lh fluss-flink/fluss-flink-tiering/target/ >&2
            exit 1
          fi
          echo "Distribution tarball: $(du -sh $DIST_TGZ | cut -f1)"
          echo "tiering jar: $(du -sh $TIERING_JAR)"

      - name: Prepare Fluss Docker build context
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/fluss-docker-context
          mkdir -p /tmp/fluss-docker-context/build-target

          cp docker/fluss/Dockerfile          /tmp/fluss-docker-context/
          cp docker/fluss/docker-entrypoint.sh /tmp/fluss-docker-context/

          tar -xzf \
            "fluss-dist/target/fluss-${{ steps.versions.outputs.fluss_version }}-bin.tgz" \
            -C /tmp/fluss-docker-context/build-target \
            --strip-components=1

          # Sanity-check the extracted layout.
          test -f /tmp/fluss-docker-context/Dockerfile
          test -f /tmp/fluss-docker-context/docker-entrypoint.sh
          test -d /tmp/fluss-docker-context/build-target/bin
          test -d /tmp/fluss-docker-context/build-target/lib
          echo "Fluss Docker build context ready."

      - name: Build Fluss Docker image
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            -t apache/fluss:${{ steps.versions.outputs.fluss_docker_version }} \
            /tmp/fluss-docker-context

          docker image inspect apache/fluss:${{ steps.versions.outputs.fluss_docker_version }} \
            --format '{{.Id}} {{.RepoTags}}'

      # ----------------------------------------------------------
      # Build the local Gateway image referenced by the documentation.
      # ----------------------------------------------------------
      - name: Build Gateway Docker image
        shell: bash
        run: |
          set -euo pipefail

          docker/fluss-gateway/build.sh

          docker image inspect fluss-gateway:dev \
            --format '{{.Id}} {{.RepoTags}}'

      # ----------------------------------------------------------
      # Build a matching 1.0 development Flink quickstart image locally.
      # Falls back to fetching prepare_build.sh from origin/main if the
      # branch does not yet contain it.
      # ----------------------------------------------------------
      - name: Prepare Flink quickstart build
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f docker/quickstart-flink/prepare_build.sh ]]; then
            FLUSS_VERSION="${{ steps.versions.outputs.fluss_version }}" \
              docker/quickstart-flink/prepare_build.sh
          else
            echo "prepare_build.sh not on this branch — fetching from origin/main"
            git show origin/main:docker/quickstart-flink/prepare_build.sh \
              > docker/quickstart-flink/prepare_build.sh
            chmod +x docker/quickstart-flink/prepare_build.sh
            FLUSS_VERSION="${{ steps.versions.outputs.fluss_version }}" \
              docker/quickstart-flink/prepare_build.sh
            rm -f docker/quickstart-flink/prepare_build.sh
          fi

      - name: Build Flink quickstart Docker image
        shell: bash
        run: |
          set -euo pipefail

          docker buildx build \
            --load \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to   type=gha,mode=max \
            -t apache/fluss-quickstart-flink:${{ steps.versions.outputs.flink_docker_version }} \
            docker/quickstart-flink

          docker image inspect \
            apache/fluss-quickstart-flink:${{ steps.versions.outputs.flink_docker_version }} \
            --format '{{.Id}} {{.RepoTags}}'

      # ----------------------------------------------------------
      # Pull only registry-backed services. Fluss, Gateway, and the Flink
      # quickstart image were built locally above.
      # ----------------------------------------------------------
      - name: Pull external Compose images
        shell: bash
        run: |
          set -euo pipefail
          docker compose \
            -f "$COMPOSE_FILE" \
            pull rustfs rustfs-init zookeeper

      # ----------------------------------------------------------
      # Start the stack from the Compose block in the documentation.
      # ----------------------------------------------------------
      - name: Start Compose stack
        shell: bash
        run: |
          set -euo pipefail


          # The Compose file mounts the paimon-s3 jar from $LIB_DIR.
          # Create a symlink so the relative ./lib path in the Compose file
          # resolves correctly when the file lives in /tmp/.
          mkdir -p /tmp/lib
          PAIMON_VERSION="${{ steps.versions.outputs.paimon_version }}"
          # The Compose file uses ./lib/... relative to its own directory (/tmp/).
          # The jar was downloaded to $LIB_DIR which is already /tmp/lib — no copy needed.

          docker compose \
            -f "$COMPOSE_FILE" \
            up -d

          docker compose \
            -f "$COMPOSE_FILE" \
            ps

      # ----------------------------------------------------------
      # Match the documented startup check, but add an explicit timeout.
      # Polls the actual /v1/clusters/default/databases endpoint — more
      # meaningful than /health or /ready because it exercises Fluss
      # connectivity end-to-end.
      # ----------------------------------------------------------
      - name: Wait for Gateway and Fluss
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for Gateway to reach Fluss (up to 300 s)..."
          for i in $(seq 1 150); do
            if curl -fsS \
                "${GATEWAY_URL}/v1/clusters/default/databases" \
                -o /tmp/gateway-databases.json 2>/dev/null; then
              echo "Gateway is up and can reach Fluss."
              cat /tmp/gateway-databases.json
              exit 0
            fi
            echo "  attempt $i/150 — retrying in 5 s..."
            sleep 2
          done

          echo "ERROR: Timed out waiting for Gateway to reach Fluss." >&2
          docker compose -f "$COMPOSE_FILE" ps >&2
          docker compose -f "$COMPOSE_FILE" logs --tail=50 gateway >&2
          exit 1

      # ----------------------------------------------------------
      # Retry helper for the transient startup race between Gateway and
      # the Fluss coordinator. Handles:
      #   - HTTP 503 (Gateway not yet ready)
      #   - HTTP 400 with a Fluss-connection error message (transient)
      #   - HTTP 400 with code "unavailable" (transient)
      # All other non-2xx responses fail immediately.
      # ----------------------------------------------------------
      - name: Write Gateway retry helper
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/is_transient_error.py <<'PYEOF' 
          import json, sys
          try:
            body = json.loads (open(sys.argv[1]).read())
          except Exception:
            sys.exit(1)
          error = body.get ("error", {})
          code = error.get("code", "")
          msg = error.get("message", "")
          transient = (
            code == "unavailable"
            or (code == "invalid_argument" and "while trying to connect to Fluss" in msg)
          sys.exit(0 if transient else 1) 
          PYEOF
          cat > /tmp/gateway_request.sh <<'SCRIPT'
          #!/usr/bin/env bash
          # Usage: gateway_request.sh METHOD URL [DATA_FILE]
          # Writes the response body to stdout on success.
          set -euo pipefail

          method="$1"
          url="$2"
          data_file="${3:-}"
          max_attempts=60
          sleep_seconds=5
          response_file="$(mktemp)"

          cleanup() { rm -f "$response_file"; }
          trap cleanup EXIT

          for i in $(seq 1 "$max_attempts"); do
            if [[ -n "$data_file" ]]; then
              http_code="$(curl -sS -o "$response_file" -w '%{http_code}' \
                -X "$method" \
                -H 'Content-Type: application/json' \
                --data "@$data_file" \
                "$url")"
            else
              http_code="$(curl -sS -o "$response_file" -w '%{http_code}' \
                -X "$method" \
                "$url")"
            fi

            # Success.
            if [[ "$http_code" == 2* ]]; then
              cat "$response_file"
              exit 0
            fi

            # Transient: Gateway not yet ready.
            if [[ "$http_code" == "503" ]]; then
              echo "Gateway returned HTTP 503 gateway not ready yet; retrying ($i/$max_attempts)..." >&2
              sleep "$sleep_seconds"
              continue
            fi

            # Transient: Gateway returned 400 due to Fluss not yet reachable.
            if [[ "$http_code" == "400" ]]; then
              if python3 /tmp/is_transient_error.py "$response_file"; then
              echo "HTTP 400 transient fluss-connection error; retrying ($i/$max_attempts)..." >&2
                cat "$response_file" >&2
                sleep "$sleep_seconds"
                continue
              fi
            fi

            # Non-transient failure.
            echo "Gateway request failed with HTTP $http_code:" >&2
            cat "$response_file" >&2
            exit 1
          done

          echo "Gateway request timed out after $((max_attempts * sleep_seconds)) s." >&2
          cat "$response_file" >&2
          exit 1
          SCRIPT

          chmod +x /tmp/gateway_request.sh

      # ----------------------------------------------------------
      # Create the database exactly as documented.
      # ----------------------------------------------------------
      - name: Create database
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/create-db.json <<'JSON'
          {"database": "gateway_demo"}
          JSON

          /tmp/gateway_request.sh \
            POST \
            "${GATEWAY_URL}/v1/clusters/default/databases" \
            /tmp/create-db.json

      # ----------------------------------------------------------
      # Create the lake-enabled orders table exactly as documented.
      # ----------------------------------------------------------
      - name: Create lake-enabled table
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/create-table.json <<'JSON'
          {
            "table_name": "orders",
            "columns": [
              {"name": "order_id",     "data_type": {"type": "INTEGER"}, "nullable": false},
              {"name": "customer",     "data_type": {"t
          exit 1

      # ------------------------------------------------------------
      # Retry helper for the transient startup race between Gateway and
      # the Fluss coordinator. All non-transient responses fail immediately.
      # ------------------------------------------------------------
      - name: Write Gateway retry helper
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/gateway_request.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          method="$1"
          url="$2"
          data_file="${3:-}"
          max_attempts=60
          sleep_seconds=5
          response_file="$(mktemp)"

          cleanup() { rm -f "$response_file"; }
          trap cleanup EXIT

          for i in $(seq 1 "$max_attempts"); do
            if [[ -n "$data_file" ]]; then
              http_code="$({
                curl -sS -o "$response_file" -w '%{http_code}' \
                  -X "$method" \
                  -H 'Content-Type: application/json' \
                  --data "@$data_file" \
                  "$url"
              })"
            else
              http_code="$({
                curl -sS -o "$response_file" -w '%{http_code}' \
                  -X "$method" \
                  "$url"
              })"
            fi

            if [[ "$http_code" == 2* ]]; then
              cat "$response_file"
              exit 0
            fi

            if [[ "$http_code" == "503" ]]; then
              echo "Gateway returned HTTP 503; retrying ($i/$max_attempts)..."
              sleep "$sleep_seconds"
              continue
            fi

            if [[ "$http_code" == "400" ]] && python3 - "$response_file" <<'PY'
          import json
          import sys

          try:
              body = json.loads(open(sys.argv[1]).read())
          except Exception:
              raise SystemExit(1)

          error = body.get("error", {})
          transient = (
              error.get("code") == "invalid_argument"
              and "while trying to connect to Fluss" in error.get("message", "")
          )
          raise SystemExit(0 if transient else 1)
          PY
            then
              echo "Gateway returned transient Fluss-connection HTTP 400; retrying ($i/$max_attempts)..."
              cat "$response_file"
              sleep "$sleep_seconds"
              continue
            fi

            echo "Gateway request failed with HTTP $http_code:" >&2
            cat "$response_file" >&2
            exit 1
          done

          echo "Gateway request timed out after $((max_attempts * sleep_seconds))s." >&2
          cat "$response_file" >&2
          exit 1
          SCRIPT

          chmod +x /tmp/gateway_request.sh

      # ------------------------------------------------------------
      # Create the database exactly as documented.
      # ------------------------------------------------------------
      - name: Create database
        shell: bash
        run: |
          cat >/tmp/create-db.json <<'JSON'
          {
            "database": "gateway_demo"
          }
          JSON

          /tmp/gateway_request.sh \
            POST \
            http://localhost:8080/v1/clusters/default/databases \
            /tmp/create-db.json

      # ------------------------------------------------------------
      # Create the lake-enabled orders table exactly as documented.
      # ------------------------------------------------------------
      - name: Create lake-enabled table
        shell: bash
        run: |
          cat >/tmp/create-table.json <<'JSON'
          {
            "table_name": "orders",
            "columns": [
              {"name": "order_id", "data_type": {"type": "INTEGER"}, "nullable": false},
              {"name": "customer", "data_type": {"type": "STRING"}, "nullable": true},
              {"name": "amount_cents", "data_type": {"type": "BIGINT"}, "nullable": true},
              {"name": "status", "data_type": {"type": "STRING"}, "nullable": true}
            ],
            "primary_key": ["order_id"],
            "distribution": {"bucket_count": 1, "bucket_keys": ["order_id"]},
            "configs": {
              "table.datalake.enabled": "true",
              "table.datalake.freshness": "30s"
            }
          }
          JSON

          /tmp/gateway_request.sh \
            POST \
            http://localhost:8080/v1/clusters/default/databases/gateway_demo/tables \
            /tmp/create-table.json

      # ------------------------------------------------------------
      # Write the three orders from the latest documentation.
      # ------------------------------------------------------------
      - name: Write initial records
        shell: bash
        run: |
          cat >/tmp/write-records.json <<'JSON'
          {
            "entries": [
              {"id": "order-1", "upsert": {"order_id": 1, "customer": "Alice", "amount_cents": 4599, "status": "placed"}},
              {"id": "order-2", "upsert": {"order_id": 2, "customer": "Bob", "amount_cents": 12000, "status": "placed"}},
              {"id": "order-3", "upsert": {"order_id": 3, "customer": "Carol", "amount_cents": 750, "status": "placed"}}
            ]
          }
          JSON

          /tmp/gateway_request.sh \
            POST \
            http://localhost:8080/v1/clusters/default/databases/gateway_demo/tables/orders/records \
            /tmp/write-records.json \
            >/tmp/write-records-response.json

          cat /tmp/write-records-response.json

          python3 - <<'PY'
          import json

          body = json.loads(open("/tmp/write-records-response.json").read())
          assert body["row_count"] == 3, body
          assert body["success_count"] == 3, body
          assert body["error_count"] == 0, body
          assert len(body["successes"]) == 3, body
          assert body["failures"] == [], body
          PY

      # ------------------------------------------------------------
      # Query immediately through Flink Union Read, before tiering starts.
      # ------------------------------------------------------------
      - name: Verify immediate Union Read
        shell: bash
        run: |
          cat >/tmp/query-immediate.sql <<'SQL'
          CREATE CATALOG fluss_catalog WITH (
              'type' = 'fluss',
              'bootstrap.servers' = 'coordinator-server:9123',
              'paimon.s3.access-key' = 'rustfsadmin',
              'paimon.s3.secret-key' = 'rustfsadmin'
          );

          USE CATALOG fluss_catalog;
          USE gateway_demo;
          SET 'sql-client.execution.result-mode' = 'tableau';
          SET 'execution.runtime-mode' = 'batch';

          SELECT COUNT(*) AS union_count FROM orders;
          SELECT order_id, customer, amount_cents, status FROM orders ORDER BY order_id;
          SQL

          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            run --rm -T sql-client \
            bash -lc '/opt/flink/bin/sql-client.sh < /tmp/query-immediate.sql' \
            | tee /tmp/immediate-query.out

          grep -Eq '(^|[^0-9])3([^0-9]|$)' /tmp/immediate-query.out
          grep -q 'Alice' /tmp/immediate-query.out
          grep -q 'Bob' /tmp/immediate-query.out
          grep -q 'Carol' /tmp/immediate-query.out

      # ------------------------------------------------------------
      # Start the Lakehouse Tiering Service exactly as documented.
      # ------------------------------------------------------------
      - name: Start Lakehouse Tiering Service
        shell: bash
        run: |
          set -euo pipefail

          tiering_jar="/opt/flink/opt/fluss-flink-tiering-${{ steps.versions.outputs.fluss_version }}.jar"

          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            exec -T jobmanager \
            bash -lc "test -f '${tiering_jar}'"

          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            exec -T jobmanager \
            /opt/flink/bin/flink run -d \
              "${tiering_jar}" \
              --fluss.bootstrap.servers coordinator-server:9123 \
              --datalake.format paimon \
              --datalake.paimon.metastore filesystem \
              --datalake.paimon.warehouse s3://fluss/paimon \
              --datalake.paimon.s3.endpoint http://rustfs:9000 \
              --datalake.paimon.s3.access.key rustfsadmin \
              --datalake.paimon.s3.secret.key rustfsadmin \
              --datalake.paimon.s3.path.style.access true

          sleep 5

          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            exec -T jobmanager \
            /opt/flink/bin/flink list

      # ------------------------------------------------------------
      # Wait for the first Paimon snapshot and the three lake rows.
      # ------------------------------------------------------------
      - name: Verify initial Paimon tiering
        shell: bash
        run: |
          set -euo pipefail

          cat >/tmp/query-lake-count.sql <<'SQL'
          CREATE CATALOG fluss_catalog WITH (
              'type' = 'fluss',
              'bootstrap.servers' = 'coordinator-server:9123',
              'paimon.s3.access-key' = 'rustfsadmin',
              'paimon.s3.secret-key' = 'rustfsadmin'
          );

          USE CATALOG fluss_catalog;
          USE gateway_demo;
          SET 'execution.runtime-mode' = 'batch';

          SELECT COUNT(*) AS lake_rows FROM orders$lake;
          SQL

          for i in {1..60}; do
            output="$({
              docker compose \
                -f /tmp/gateway-lakehouse-compose.yaml \
                run --rm -T sql-client \
                bash -lc '/opt/flink/bin/sql-client.sh < /tmp/query-lake-count.sql'
            } 2>&1 || true)"

            echo "$output"
            if echo "$output" | grep -Eq '(^|[^0-9])3([^0-9]|$)'; then
              echo "Three records are visible in Paimon."
              exit 0
            fi

            echo "Waiting for lake tiering... ($i/60)"
            sleep 5
          done

          echo "Timed out waiting for three lake rows." >&2
          exit 1

      - name: Verify Paimon snapshots
        shell: bash
        run: |
          cat >/tmp/query-snapshots.sql <<'SQL'
          CREATE CATALOG fluss_catalog WITH (
              'type' = 'fluss',
              'bootstrap.servers' = 'coordinator-server:9123',
              'paimon.s3.access-key' = 'rustfsadmin',
              'paimon.s3.secret-key' = 'rustfsadmin'
          );

          USE CATALOG fluss_catalog;
          USE gateway_demo;
          SET 'execution.runtime-mode' = 'batch';

          SELECT snapshot_id, total_record_count
          FROM orders$lake$snapshots
          ORDER BY snapshot_id;
          SQL

          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            run --rm -T sql-client \
            bash -lc '/opt/flink/bin/sql-client.sh < /tmp/query-snapshots.sql' \
            | tee /tmp/snapshots.out

          grep -Eq '(^|[^0-9])3([^0-9]|$)' /tmp/snapshots.out

      # ------------------------------------------------------------
      # Write order 4 through Gateway after tiering has begun.
      # ------------------------------------------------------------
      - name: Write fresh record through Gateway
        shell: bash
        run: |
          cat >/tmp/write-order-4.json <<'JSON'
          {
            "entries": [
              {
                "id": "order-4",
                "upsert": {
                  "order_id": 4,
                  "customer": "Dave",
                  "amount_cents": 2200,
                  "status": "placed"
                }
              }
            ]
          }
          JSON

          /tmp/gateway_request.sh \
            POST \
            http://localhost:8080/v1/clusters/default/databases/gateway_demo/tables/orders/records \
            /tmp/write-order-4.json \
            >/tmp/write-order-4-response.json

          cat /tmp/write-order-4-response.json

          python3 - <<'PY'
          import json

          body = json.loads(open("/tmp/write-order-4-response.json").read())
          assert body["row_count"] == 1, body
          assert body["success_count"] == 1, body
          assert body["error_count"] == 0, body
          assert len(body["successes"]) == 1, body
          assert body["failures"] == [], body
          PY

      # ------------------------------------------------------------
      # Union Read should see order 4 immediately, before lake tiering.
      # ------------------------------------------------------------
      - name: Verify Union Read sees fresh Gateway write
        shell: bash
        run: |
          cat >/tmp/query-fresh-union.sql <<'SQL'
          CREATE CATALOG fluss_catalog WITH (
              'type' = 'fluss',
              'bootstrap.servers' = 'coordinator-server:9123',
              'paimon.s3.access-key' = 'rustfsadmin',
              'paimon.s3.secret-key' = 'rustfsadmin'
          );

          USE CATALOG fluss_catalog;
          USE gateway_demo;
          SET 'execution.runtime-mode' = 'batch';

          SELECT COUNT(*) AS union_count FROM orders;
          SELECT order_id, customer, amount_cents, status
          FROM orders
          WHERE order_id = 4;
          SQL

          for i in {1..30}; do
            output="$({
              docker compose \
                -f /tmp/gateway-lakehouse-compose.yaml \
                run --rm -T sql-client \
                bash -lc '/opt/flink/bin/sql-client.sh < /tmp/query-fresh-union.sql'
            } 2>&1 || true)"

            echo "$output"
            if echo "$output" | grep -q 'Dave'; then
              echo "Union Read sees order 4."
              exit 0
            fi

            echo "Waiting for fresh Union Read result... ($i/30)"
            sleep 3
          done

          echo "Timed out waiting for Union Read to see order 4." >&2
          exit 1

      # ------------------------------------------------------------
      # Wait for order 4 to reach Paimon too.
      # ------------------------------------------------------------
      - name: Verify fresh record is eventually tiered
        shell: bash
        run: |
          set -euo pipefail

          cat >/tmp/query-fresh-lake.sql <<'SQL'
          CREATE CATALOG fluss_catalog WITH (
              'type' = 'fluss',
              'bootstrap.servers' = 'coordinator-server:9123',
              'paimon.s3.access-key' = 'rustfsadmin',
              'paimon.s3.secret-key' = 'rustfsadmin'
          );

          USE CATALOG fluss_catalog;
          USE gateway_demo;
          SET 'execution.runtime-mode' = 'batch';

          SELECT COUNT(*) AS lake_rows FROM orders$lake;
          SQL

          for i in {1..60}; do
            output="$({
              docker compose \
                -f /tmp/gateway-lakehouse-compose.yaml \
                run --rm -T sql-client \
                bash -lc '/opt/flink/bin/sql-client.sh < /tmp/query-fresh-lake.sql'
            } 2>&1 || true)"

            echo "$output"
            if echo "$output" | grep -Eq '(^|[^0-9])4([^0-9]|$)'; then
              echo "Four records are visible in Paimon."
              exit 0
            fi

            echo "Waiting for order 4 to reach the lake... ($i/60)"
            sleep 5
          done

          echo "Timed out waiting for order 4 to reach the lake." >&2
          exit 1

      # ------------------------------------------------------------
      # Final end-to-end query.
      # ------------------------------------------------------------
      - name: Final end-to-end validation
        shell: bash
        run: |
          cat >/tmp/query-final.sql <<'SQL'
          CREATE CATALOG fluss_catalog WITH (
              'type' = 'fluss',
              'bootstrap.servers' = 'coordinator-server:9123',
              'paimon.s3.access-key' = 'rustfsadmin',
              'paimon.s3.secret-key' = 'rustfsadmin'
          );

          USE CATALOG fluss_catalog;
          USE gateway_demo;
          SET 'execution.runtime-mode' = 'batch';

          SELECT COUNT(*) AS snapshot_count FROM orders$lake$snapshots;
          SELECT COUNT(*) AS lake_count FROM orders$lake;
          SELECT COUNT(*) AS union_count FROM orders;
          SELECT order_id, customer, amount_cents, status FROM orders ORDER BY order_id;
          SQL

          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            run --rm -T sql-client \
            bash -lc '/opt/flink/bin/sql-client.sh < /tmp/query-final.sql' \
            | tee /tmp/final-query.out

          grep -q 'Alice' /tmp/final-query.out
          grep -q 'Bob' /tmp/final-query.out
          grep -q 'Carol' /tmp/final-query.out
          grep -q 'Dave' /tmp/final-query.out

      # ------------------------------------------------------------
      # Cleanup exactly as documented.
      # ------------------------------------------------------------
      - name: Cleanup through Gateway
        shell: bash
        run: |
          /tmp/gateway_request.sh \
            DELETE \
            http://localhost:8080/v1/clusters/default/databases/gateway_demo/tables/orders

          /tmp/gateway_request.sh \
            DELETE \
            http://localhost:8080/v1/clusters/default/databases/gateway_demo

      # ------------------------------------------------------------
      # Always collect diagnostics on failure.
      # ------------------------------------------------------------
      - name: Collect diagnostics
        if: failure()
        shell: bash
        run: |
          docker compose -f /tmp/gateway-lakehouse-compose.yaml ps || true
          echo "===== coordinator ====="
          docker compose -f /tmp/gateway-lakehouse-compose.yaml logs --tail=300 coordinator-server || true
          echo "===== tablet ====="
          docker compose -f /tmp/gateway-lakehouse-compose.yaml logs --tail=300 tablet-server || true
          echo "===== gateway ====="
          docker compose -f /tmp/gateway-lakehouse-compose.yaml logs --tail=500 gateway || true
          echo "===== jobmanager ====="
          docker compose -f /tmp/gateway-lakehouse-compose.yaml logs --tail=500 jobmanager || true
          echo "===== taskmanager ====="
          docker compose -f /tmp/gateway-lakehouse-compose.yaml logs --tail=500 taskmanager || true
          echo "===== rustfs ====="
          docker compose -f /tmp/gateway-lakehouse-compose.yaml logs --tail=300 rustfs || true

      - name: Tear down Compose stack
        if: always()
        run: |
          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            down -v --remove-orphans
