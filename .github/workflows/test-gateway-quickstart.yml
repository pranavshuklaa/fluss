name: Test Gateway Lakehouse Quickstart

on:
  push:
    branches:
      - test/quickstart
  workflow_dispatch:

jobs:
  gateway-lakehouse-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show versions
        run: |
          docker version
          docker compose version
          java -version

      # ------------------------------------------------------------
      # Resolve the versions used by the documentation.
      # ------------------------------------------------------------
      - name: Resolve quickstart versions
        id: versions
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path("website/fluss-versions.json").read_text())
          next_version = next(
              v for v in data if v["versionName"] == "next"
          )

          fluss_version = next_version["fullVersion"]
          fluss_docker_version = next_version["dockerVersion"]
          paimon_version = next_version["paimonVersion"]
          flink_docker_version = "1.20-0.9.1-incubating"

          print(f"FLUSS_VERSION={fluss_version}")
          print(f"FLUSS_DOCKER_VERSION={fluss_docker_version}")
          print(f"PAIMON_VERSION={paimon_version}")
          print(f"FLINK_DOCKER_VERSION={flink_docker_version}")

          output_file = os.environ["GITHUB_OUTPUT"]

          with open(output_file, "a") as f:
              f.write(f"fluss_version={fluss_version}\n")
              f.write(f"fluss_docker_version={fluss_docker_version}\n")
              f.write(f"paimon_version={paimon_version}\n")
              f.write(f"flink_docker_version={flink_docker_version}\n")
          PY

      # ------------------------------------------------------------
      # Extract the Docker Compose example from the quickstart and
      # substitute the documented version placeholders.
      # ------------------------------------------------------------
      - name: Prepare Compose file from documentation
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          import json

          md = Path("website/docs/quickstart/gateway-lakehouse.md").read_text()

          blocks = re.findall(r"```yaml\s*\n(.*?)```", md, re.S)
          if not blocks:
              raise SystemExit("No YAML fenced block found in quickstart")

          compose = blocks[0]

          versions = {
              "$FLUSS_VERSION$": "${{ steps.versions.outputs.fluss_version }}",
              "$FLUSS_DOCKER_VERSION$": "${{ steps.versions.outputs.fluss_docker_version }}",
              "$PAIMON_VERSION$": "${{ steps.versions.outputs.paimon_version }}",
              "$FLUSS_QUICKSTART_FLINK_DOCKER_VERSION$":
                  "${{ steps.versions.outputs.flink_docker_version }}",
          }

          for old, new in versions.items():
              compose = compose.replace(old, new)

          Path("/tmp/gateway-lakehouse-compose.yaml").write_text(compose)
          print(compose)
          PY

          echo "---- docker compose config ----"
          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            config

      # ------------------------------------------------------------
      # Build Apache Fluss from source.
      #
      # docker/fluss/Dockerfile explicitly COPYs build-target/,
      # which is generated by the Maven build.
      # ------------------------------------------------------------
      - name: Build Fluss distribution
        run: |
          ./mvnw clean package -DskipTests -T 1C

          test -d build-target
          test -d fluss-dist/target

          echo "---- build-target link check ----"
          # build-target is typically a symlink into fluss-dist/target/... —
          # report that explicitly so a dangling-symlink bug (see the next
          # step) is obvious from this log instead of surfacing three steps
          # downstream as a BuildKit "not found" error.
          if [ -L build-target ]; then
            echo "build-target is a symlink -> $(readlink -f build-target)"
          else
            echo "build-target is a real directory"
          fi

          echo "---- Fluss distribution ----"
          find fluss-dist/target -maxdepth 1 -type f -print

          echo "---- build-target ----"
          find build-target -maxdepth 2 -type f | head -100

      - name: Prepare Fluss Docker build context
        run: |
          rm -rf /tmp/fluss-docker-context
          mkdir -p /tmp/fluss-docker-context

          cp -a docker/fluss/Dockerfile /tmp/fluss-docker-context/
          cp -a docker/fluss/docker-entrypoint.sh /tmp/fluss-docker-context/
          # -L dereferences the build-target symlink so BuildKit gets a real
          # directory tree in its build context instead of a dangling link
          # (cp -a alone copies the symlink itself, which -- once outside
          # the original repo layout -- points nowhere and makes the later
          # `docker build` fail with "/build-target: not found").
          cp -aL build-target /tmp/fluss-docker-context/build-target

          echo "---- Docker context ----"
          du -sh /tmp/fluss-docker-context
          test -d /tmp/fluss-docker-context/build-target
          test -f /tmp/fluss-docker-context/Dockerfile
          test -f /tmp/fluss-docker-context/docker-entrypoint.sh
          # Fail loudly here rather than inside `docker build` if the
          # dereferenced copy is somehow empty.
          [ -n "$(find /tmp/fluss-docker-context/build-target -maxdepth 1 -mindepth 1)" ] \
            || { echo "build-target copy is empty after dereferencing" >&2; exit 1; }

      - name: Build Fluss Docker image
        run: |
          docker build \
            -t apache/fluss:${{ steps.versions.outputs.fluss_docker_version }} \
            /tmp/fluss-docker-context

          docker image inspect \
            apache/fluss:${{ steps.versions.outputs.fluss_docker_version }}

      # ------------------------------------------------------------
      # Build Gateway image.
      # ------------------------------------------------------------
      - name: Build Gateway Docker image
        run: |
          docker/fluss-gateway/build.sh

          docker image inspect fluss-gateway:dev

      # ------------------------------------------------------------
      # Pull only the images that actually come from a registry.
      # coordinator-server/tablet-server (apache/fluss:<version>) and
      # gateway (fluss-gateway:dev) were just built locally above, and
      # neither is published anywhere -- `docker compose pull` on the bare
      # `image:` reference would otherwise try to fetch them from Docker
      # Hub, 404, and abort the pull for every other service too.
      # ------------------------------------------------------------
      - name: Pull Compose images
        run: |
          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            pull --ignore-buildable \
            rustfs rustfs-init zookeeper jobmanager taskmanager sql-client

      # ------------------------------------------------------------
      # Start stack.
      # ------------------------------------------------------------
      - name: Start Compose stack
        run: |
          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            up -d

          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            ps

      # ------------------------------------------------------------
      # Wait for the core infrastructure.
      # ------------------------------------------------------------
      - name: Wait for core containers
        shell: bash
        run: |
          set -e

          compose() {
            docker compose \
              -f /tmp/gateway-lakehouse-compose.yaml \
              "$@"
          }

          for i in {1..60}; do
            if compose ps --status running | grep -q coordinator-server; then
              echo "Coordinator is running"
              break
            fi

            echo "Waiting for coordinator... ($i/60)"
            sleep 5
          done

          compose ps

      # ------------------------------------------------------------
      # Gateway health/readiness.
      # ------------------------------------------------------------
      - name: Wait for Gateway
        shell: bash
        run: |
          set -e

          for i in {1..60}; do
            if curl -sS --fail http://localhost:8080/health >/tmp/gateway-health.json 2>/tmp/gateway-health.err; then
              echo "Gateway /health is ready"
              cat /tmp/gateway-health.json
              break
            fi

            echo "Waiting for Gateway /health... ($i/60)"
            sleep 2
          done

          curl -sS --fail-with-body http://localhost:8080/health

          for i in {1..60}; do
            if curl -sS --fail http://localhost:8080/ready >/tmp/gateway-ready.json 2>/tmp/gateway-ready.err; then
              echo "Gateway /ready is ready"
              cat /tmp/gateway-ready.json
              break
            fi

            echo "Waiting for Gateway /ready... ($i/60)"
            sleep 2
          done

          curl -sS --fail-with-body http://localhost:8080/ready

      # ------------------------------------------------------------
      # Download Paimon S3 bundle into the SQL client container.
      # ------------------------------------------------------------
      - name: Download Paimon S3 jar
        shell: bash
        run: |
          PAIMON_VERSION="${{ steps.versions.outputs.paimon_version }}"

          curl -fL \
            "https://repo1.maven.org/maven2/org/apache/paimon/paimon-s3/${PAIMON_VERSION}/paimon-s3-${PAIMON_VERSION}.jar" \
            -o /tmp/paimon-s3.jar

          test -s /tmp/paimon-s3.jar

      # ------------------------------------------------------------
      # Shared retry helper for Gateway writes.
      #
      # /health and /ready do not verify Fluss connectivity (documented in
      # website/docs/gateway/index.md), so the Gateway can report "ready"
      # while it is still retrying its connection to coordinator-server in
      # the background. Two distinct symptoms of that same underlying race
      # have been observed against this stack:
      #
      #   - HTTP 503, `unavailable` -- the connection to Fluss hasn't been
      #     established at all yet.
      #   - HTTP 400, `invalid_argument`, with the message "Fluss rejected
      #     the request while trying to connect to Fluss" -- seen once the
      #     TCP connection succeeds but the coordinator hasn't finished its
      #     own startup (metadata/leader init) and rejects the RPC. This
      #     code does not match its own OpenAPI spec's documented meaning
      #     for 400 ("malformed body or invalid definition") given the
      #     request body is schema-valid, which points to this being a
      #     generic fallback the Gateway uses for an RPC error it doesn't
      #     have a more specific mapping for -- not a real client error.
      #
      # Retry BOTH signatures with backoff. Anything else fails immediately
      # with the full response body, so a genuine error is never masked.
      # ------------------------------------------------------------
      - name: Write Gateway retry helper
        shell: bash
        run: |
          cat >/tmp/gateway_request.sh <<'SCRIPT'
          #!/usr/bin/env bash
          # Usage: gateway_request.sh <METHOD> <URL> [DATA_FILE]
          # Retries on:
          #   - HTTP 503 (Fluss unavailable / gateway still starting)
          #   - HTTP 400 with code=invalid_argument AND a message containing
          #     "while trying to connect to Fluss" (coordinator not fully up
          #     yet, mislabeled by the Gateway as a client error)
          # Fails immediately, printing the full response body, on any other
          # status or error signature.
          set -euo pipefail

          METHOD="$1"
          URL="$2"
          DATA_FILE="${3:-}"

          MAX_ATTEMPTS=30
          SLEEP_SECONDS=3
          RESPONSE_FILE="$(mktemp)"

          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            if [[ -n "$DATA_FILE" ]]; then
              http_code="$(
                curl -sS -o "$RESPONSE_FILE" -w '%{http_code}' \
                  -X "$METHOD" "$URL" \
                  -H 'Content-Type: application/json' \
                  --data "@${DATA_FILE}"
              )"
            else
              http_code="$(
                curl -sS -o "$RESPONSE_FILE" -w '%{http_code}' -X "$METHOD" "$URL"
              )"
            fi

            if [[ "$http_code" == 2* ]]; then
              echo "Succeeded (HTTP $http_code)"
              cat "$RESPONSE_FILE"
              rm -f "$RESPONSE_FILE"
              exit 0
            fi

            if [[ "$http_code" == "503" ]]; then
              echo "Gateway not yet connected to Fluss (HTTP 503) - retrying ($i/$MAX_ATTEMPTS)..."
              sleep "$SLEEP_SECONDS"
              continue
            fi

            if [[ "$http_code" == "400" ]] \
                && [[ "$(jq -r '.error.code // empty' "$RESPONSE_FILE" 2>/dev/null)" == "invalid_argument" ]] \
                && jq -e '.error.message // "" | test("while trying to connect to Fluss")' "$RESPONSE_FILE" >/dev/null 2>&1; then
              echo "Coordinator not fully initialized yet (HTTP 400, invalid_argument) - retrying ($i/$MAX_ATTEMPTS)..."
              cat "$RESPONSE_FILE"
              sleep "$SLEEP_SECONDS"
              continue
            fi

            echo "Request failed with unexpected HTTP $http_code:"
            cat "$RESPONSE_FILE"
            rm -f "$RESPONSE_FILE"
            exit 1
          done

          echo "Gateway never became ready to reach Fluss after $((MAX_ATTEMPTS * SLEEP_SECONDS))s"
          cat "$RESPONSE_FILE"
          rm -f "$RESPONSE_FILE"
          exit 1
          SCRIPT

          chmod +x /tmp/gateway_request.sh

      # ------------------------------------------------------------
      # Create database through Gateway REST API.
      # ------------------------------------------------------------
      - name: Create database
        shell: bash
        run: |
          set -e

          cat >/tmp/create-db.json <<'JSON'
          {
            "database": "gateway_demo"
          }
          JSON

          /tmp/gateway_request.sh POST \
            http://localhost:8080/v1/clusters/default/databases \
            /tmp/create-db.json

      # ------------------------------------------------------------
      # Create lake-enabled table through Gateway REST API.
      # ------------------------------------------------------------
      - name: Create lake-enabled table
        shell: bash
        run: |
          set -e

          cat >/tmp/create-table.json <<'JSON'
          {
            "table_name": "orders",
            "columns": [
              {
                "name": "order_id",
                "data_type": {
                  "type": "INTEGER"
                },
                "nullable": false
              },
              {
                "name": "customer",
                "data_type": {
                  "type": "STRING"
                },
                "nullable": true
              },
              {
                "name": "amount_cents",
                "data_type": {
                  "type": "BIGINT"
                },
                "nullable": true
              },
              {
                "name": "status",
                "data_type": {
                  "type": "STRING"
                },
                "nullable": true
              }
            ],
            "primary_key": [
              "order_id"
            ],
            "distribution": {
              "bucket_count": 1,
              "bucket_keys": [
                "order_id"
              ]
            },
            "configs": {
              "table.datalake.enabled": "true",
              "table.datalake.freshness": "30s"
            }
          }
          JSON

          /tmp/gateway_request.sh POST \
            http://localhost:8080/v1/clusters/default/databases/gateway_demo/tables \
            /tmp/create-table.json

      # ------------------------------------------------------------
      # Write records through Gateway.
      # ------------------------------------------------------------
      - name: Write initial records
        shell: bash
        run: |
          set -e

          cat >/tmp/write-records.json <<'JSON'
          {
            "entries": [
              {
                "upsert": {
                  "order_id": 1,
                  "customer": "Alice",
                  "amount_cents": 12500,
                  "status": "CREATED"
                }
              },
              {
                "upsert": {
                  "order_id": 2,
                  "customer": "Bob",
                  "amount_cents": 8900,
                  "status": "PAID"
                }
              },
              {
                "upsert": {
                  "order_id": 3,
                  "customer": "Carol",
                  "amount_cents": 4200,
                  "status": "SHIPPED"
                }
              }
            ]
          }
          JSON

          response="$(
            /tmp/gateway_request.sh POST \
              http://localhost:8080/v1/clusters/default/databases/gateway_demo/tables/orders/records \
              /tmp/write-records.json
          )"

          echo "$response"
          echo "$response" | grep -q "upsert"
          echo "$response" | grep -q "order_id"

      # ------------------------------------------------------------
      # Wait for Flink.
      # ------------------------------------------------------------
      - name: Wait for Flink
        shell: bash
        run: |
          set -e

          for i in {1..60}; do
            if docker compose \
                -f /tmp/gateway-lakehouse-compose.yaml \
                exec -T jobmanager \
                /opt/flink/bin/flink list >/tmp/flink-list.out 2>/tmp/flink-list.err; then
              echo "Flink is ready"
              cat /tmp/flink-list.out
              break
            fi

            echo "Waiting for Flink... ($i/60)"
            sleep 3
          done

      # ------------------------------------------------------------
      # Start Lakehouse Tiering Service.
      # ------------------------------------------------------------
      - name: Start Lakehouse Tiering Service
        shell: bash
        run: |
          set -e

          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            exec -T jobmanager \
            /opt/flink/bin/flink run -d \
              /opt/flink/opt/fluss-flink-tiering-${{ steps.versions.outputs.fluss_version }}.jar \
              --fluss.bootstrap.servers coordinator-server:9123 \
              --datalake.format paimon \
              --datalake.paimon.metastore filesystem \
              --datalake.paimon.warehouse s3://fluss/paimon \
              --datalake.paimon.s3.endpoint http://rustfs:9000 \
              --datalake.paimon.s3.access.key rustfsadmin \
              --datalake.paimon.s3.secret.key rustfsadmin \
              --datalake.paimon.s3.path.style.access true

          sleep 5

          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            exec -T jobmanager \
            /opt/flink/bin/flink list

      # ------------------------------------------------------------
      # Install Paimon S3 connector in SQL client.
      # ------------------------------------------------------------
      - name: Prepare SQL client
        shell: bash
        run: |
          set -e

          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            cp /tmp/paimon-s3.jar sql-client:/tmp/paimon-s3.jar

      # ------------------------------------------------------------
      # Helper script for SQL queries.
      # ------------------------------------------------------------
      - name: Wait for initial lake snapshot
        shell: bash
        run: |
          set -e

          for i in {1..60}; do
            output="$(
              docker compose \
                -f /tmp/gateway-lakehouse-compose.yaml \
                run --rm -T sql-client \
                bash -lc '
                  cp /tmp/paimon-s3.jar /opt/flink/lib/paimon-s3.jar

                  /opt/flink/bin/sql-client.sh <<'"'"'SQL'"'"'
                  USE CATALOG fluss_catalog;
                  USE gateway_demo;
                  SET '"'"'execution.runtime-mode'"'"'='"'"'batch'"'"';

                  SELECT * FROM orders$lake$snapshots;
                  SELECT COUNT(*) FROM orders$lake;
                  SELECT COUNT(*) FROM orders;
                  SQL
                '
            )" || true

            echo "$output"

            if echo "$output" | grep -qE '3.*3|3[[:space:]]*\|[[:space:]]*3'; then
              echo "Lake data is visible"
              break
            fi

            echo "Waiting for tiering... ($i/60)"
            sleep 5
          done

      # ------------------------------------------------------------
      # Validate snapshot metadata, lake data and Union Read.
      # ------------------------------------------------------------
      - name: Validate initial lakehouse state
        shell: bash
        run: |
          set -e

          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            run --rm -T sql-client \
            bash -lc '
              cp /tmp/paimon-s3.jar /opt/flink/lib/paimon-s3.jar

              /opt/flink/bin/sql-client.sh <<'"'"'"'"'SQL'"'"'
              USE CATALOG fluss_catalog;
              USE gateway_demo;
              SET '"'"'"'"'execution.runtime-mode'"'"'"'='"'"'"'batch'"'"'"';

              SELECT * FROM orders$lake$snapshots;

              SELECT COUNT(*) AS lake_count
              FROM orders$lake;

              SELECT COUNT(*) AS union_count
              FROM orders;

              SELECT *
              FROM orders
              ORDER BY order_id;

              SQL
            '

      # ------------------------------------------------------------
      # Fresh Gateway write after tiering has begun.
      # ------------------------------------------------------------
      - name: Write fresh record through Gateway
        shell: bash
        run: |
          set -e

          cat >/tmp/write-order-4.json <<'JSON'
          {
            "entries": [
              {
                "upsert": {
                  "order_id": 4,
                  "customer": "Dave",
                  "amount_cents": 7777,
                  "status": "CREATED"
                }
              }
            ]
          }
          JSON

          response="$(
            /tmp/gateway_request.sh POST \
              http://localhost:8080/v1/clusters/default/databases/gateway_demo/tables/orders/records \
              /tmp/write-order-4.json
          )"

          echo "$response"
          echo "$response" | grep -q "upsert"
          echo "$response" | grep -q "order_id"

      # ------------------------------------------------------------
      # Union Read should see the hot record before lake tiering.
      # ------------------------------------------------------------
      - name: Validate Union Read sees fresh Gateway write
        shell: bash
        run: |
          set -e

          for i in {1..30}; do
            output="$(
              docker compose \
                -f /tmp/gateway-lakehouse-compose.yaml \
                run --rm -T sql-client \
                bash -lc '
                  cp /tmp/paimon-s3.jar /opt/flink/lib/paimon-s3.jar

                  /opt/flink/bin/sql-client.sh <<'"'"'SQL'"'"'
                  USE CATALOG fluss_catalog;
                  USE gateway_demo;
                  SET '"'"'execution.runtime-mode'"'"'='"'"'batch'"'"';

                  SELECT COUNT(*) AS union_count
                  FROM orders;

                  SELECT *
                  FROM orders
                  WHERE order_id = 4;
                  SQL
                '
            )" || true

            echo "$output"

            if echo "$output" | grep -q "4"; then
              echo "Union Read sees order 4"
              break
            fi

            echo "Waiting for fresh Union Read result... ($i/30)"
            sleep 3
          done

      # ------------------------------------------------------------
      # Wait until the fresh record reaches the lake too.
      # ------------------------------------------------------------
      - name: Validate fresh record is eventually tiered
        shell: bash
        run: |
          set -e

          for i in {1..60}; do
            output="$(
              docker compose \
                -f /tmp/gateway-lakehouse-compose.yaml \
                run --rm -T sql-client \
                bash -lc '
                  cp /tmp/paimon-s3.jar /opt/flink/lib/paimon-s3.jar

                  /opt/flink/bin/sql-client.sh <<'"'"'SQL'"'"'
                  USE CATALOG fluss_catalog;
                  USE gateway_demo;
                  SET '"'"'execution.runtime-mode'"'"'='"'"'batch'"'"';

                  SELECT COUNT(*) AS lake_count
                  FROM orders$lake;
                  SQL
                '
            )" || true

            echo "$output"

            if echo "$output" | grep -q "4"; then
              echo "Four records are now tiered into the lake"
              break
            fi

            echo "Waiting for lake tiering... ($i/60)"
            sleep 5
          done

      # ------------------------------------------------------------
      # Final validation.
      # ------------------------------------------------------------
      - name: Final end-to-end validation
        shell: bash
        run: |
          set -e

          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            run --rm -T sql-client \
            bash -lc '
              cp /tmp/paimon-s3.jar /opt/flink/lib/paimon-s3.jar

              /opt/flink/bin/sql-client.sh <<'"'"'SQL'"'"'
              USE CATALOG fluss_catalog;
              USE gateway_demo;
              SET '"'"'execution.runtime-mode'"'"'='"'"'batch'"'"';

              SELECT COUNT(*) AS snapshot_count
              FROM orders$lake$snapshots;

              SELECT COUNT(*) AS lake_count
              FROM orders$lake;

              SELECT COUNT(*) AS union_count
              FROM orders;

              SELECT *
              FROM orders
              ORDER BY order_id;
              SQL
            '

      # ------------------------------------------------------------
      # Verify Gateway cleanup.
      # ------------------------------------------------------------
      - name: Cleanup through Gateway
        shell: bash
        run: |
          set -e

          /tmp/gateway_request.sh DELETE \
            http://localhost:8080/v1/clusters/default/databases/gateway_demo/tables/orders

          /tmp/gateway_request.sh DELETE \
            http://localhost:8080/v1/clusters/default/databases/gateway_demo

      # ------------------------------------------------------------
      # Always collect diagnostics on failure.
      # ------------------------------------------------------------
      - name: Collect diagnostics
        if: failure()
        shell: bash
        run: |
          echo "================ docker compose ps ================"
          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            ps || true

          echo "================ coordinator logs ================"
          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            logs --tail=200 coordinator-server || true

          echo "================ tablet logs ================"
          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            logs --tail=200 tablet-server || true

          echo "================ gateway logs ================"
          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            logs --tail=300 gateway || true

          echo "================ jobmanager logs ================"
          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            logs --tail=300 jobmanager || true

          echo "================ taskmanager logs ================"
          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            logs --tail=300 taskmanager || true

          echo "================ rustfs logs ================"
          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            logs --tail=200 rustfs || true

      # ------------------------------------------------------------
      # Always tear down containers/volumes.
      # ------------------------------------------------------------
      - name: Tear down Compose stack
        if: always()
        run: |
          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            down -v --remove-orphans
